name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "test/**"
      - "stdlib/**"
      - "examples/**"
      - "scripts/verify-stage0-backend.sh"
      - "scripts/verify-freestanding-backend.sh"
      - "scripts/verify-package-spine.sh"
      - "scripts/verify-platform-tools.sh"
      - "scripts/verify-editor-tools.sh"
      - "scripts/verify-hosted-args.sh"
      - "scripts/verify-hosted-env.sh"
      - "scripts/verify-hosted-exit.sh"
      - "scripts/verify-hosted-file-read.sh"
      - "scripts/verify-hosted-file-write.sh"
      - "scripts/verify-hosted-config-report.sh"
      - "scripts/verify-hosted-size-report.sh"
      - "scripts/verify-hosted-lf-count.sh"
      - "scripts/lib/**"
      - "scripts/verify-text-eq.sh"
      - "scripts/verify-text-prefix.sh"
      - "scripts/verify-text-suffix.sh"
      - "scripts/verify-text-scan.sh"
      - "scripts/verify-text-lines.sh"
      - "scripts/verify-text-count.sh"
      - "scripts/verify-text-view-helpers.sh"
      - "scripts/verify-ascii-predicates.sh"
      - "scripts/verify-ascii-slice-predicates.sh"
      - "scripts/verify-ascii-trim.sh"
      - "scripts/verify-ascii-decimal-u64.sh"
      - "scripts/verify-ascii-decimal-u64-format.sh"
      - "scripts/verify-stdlib-core-combinators.sh"
      - "scripts/verify-stdlib-hosted-seed.sh"
      - "scripts/verify-x86_64-elf-backend.sh"
      - "scripts/verify-limine-bridge.sh"
      - "support/**"
      - "editors/**"
      - "cabal.project"
      - "silt.cabal"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  stage0:
    name: Stage0 checker and backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Haskell
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"

      - name: Update package index
        run: cabal update

      - name: Run test suite
        run: cabal test all

      - name: Verify platform tools
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-platform-tools.sh

      - name: Verify editor tools
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-editor-tools.sh

      - name: Verify package spine
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-package-spine.sh

      - name: Verify stdlib hosted seed
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-stdlib-hosted-seed.sh

      - name: Verify hosted args
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-hosted-args.sh

      - name: Verify hosted env
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-hosted-env.sh

      - name: Verify hosted exit
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-hosted-exit.sh

      - name: Verify hosted file write
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-hosted-file-write.sh

      - name: Verify hosted file read
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-hosted-file-read.sh

      - name: Verify hosted size report
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-hosted-size-report.sh

      - name: Verify hosted config report
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-hosted-config-report.sh

      - name: Verify hosted LF count
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-hosted-lf-count.sh

      - name: Verify text equality
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-text-eq.sh

      - name: Verify text prefix
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-text-prefix.sh

      - name: Verify text suffix
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-text-suffix.sh

      - name: Verify text scan
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-text-scan.sh

      - name: Verify text line split
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-text-lines.sh

      - name: Verify text count
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-text-count.sh

      - name: Verify text view helpers
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-text-view-helpers.sh

      - name: Verify ASCII predicates
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-ascii-predicates.sh

      - name: Verify ASCII slice predicates
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-ascii-slice-predicates.sh

      - name: Verify ASCII trim
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-ascii-trim.sh

      - name: Verify ASCII decimal U64 parser
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-ascii-decimal-u64.sh

      - name: Verify ASCII decimal U64 formatter
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-ascii-decimal-u64-format.sh

      - name: Verify stdlib core combinators
        run: SILT_SKIP_CABAL_TEST=1 scripts/verify-stdlib-core-combinators.sh

      - name: Verify hosted backend
        run: scripts/verify-stage0-backend.sh

      - name: Verify freestanding backend
        run: scripts/verify-freestanding-backend.sh

      - name: Verify x86_64 ELF bridge
        run: scripts/verify-x86_64-elf-backend.sh

      - name: Verify Limine bridge
        run: scripts/verify-limine-bridge.sh
